name: Client Sites Pages

on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - '.github/workflows/client-sites-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: client-sites-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload client sites
        uses: actions/upload-pages-artifact@v4
        with:
          path: clients
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
